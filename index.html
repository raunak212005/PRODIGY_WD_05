<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task-05</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
<body>
    <div class="container">
        <h1><i class="fas fa-cloud-sun"></i> Weather App</h1>
        <div class="search-box">
            <input type="text" id="city" placeholder="Enter City Name">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
        <button id="locationBtn">Use Current Location <i class="fa-solid fa-location-crosshairs"></i></button>
        <div class="weather-card" id="weather">
            <img id="icon">
            <h2 id="cityName"></h2>
            <h1 id="temp"></h1>
            <h3 id="condition"></h3>
            <div class="details">
                <div class="box">
                    <i class="fa-solid fa-droplet icon"></i>
                    <p>Humidity</p>
                    <span id="humidity"></span>
                </div>
                <div class="box">
                    <i class="fa-solid fa-wind icon"></i>
                    <p>Wind</p>
                    <span id="wind"></span>
                </div>
                <div class="box">
                    <i class="fa-solid fa-temperature-full icon"></i>
                    <p>Feels Like</p>
                    <span id="feels"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
